name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (English at /, Persian at /fa/)
        run: |
          set -e
          mkdir -p _site
          # Everything in reports/ is published: the English dashboard, the Excel report,
          # the CSVs and the Persian page in reports/fa/.
          rsync -a reports/ _site/
          cp reports/marketco_dashboard.html _site/index.html        # English  -> /
          if [ -f _site/fa/index.html ]; then                         # Persian  -> /fa/
            # Nicer URLs for the language switcher on the live site. In the repository the links stay
            # as plain relative file paths (fa/index.html and ../marketco_dashboard.html), so the
            # files also work when opened straight from disk.
            sed -i 's#href="fa/index.html"#href="fa/"#' _site/index.html
            sed -i 's#href="../marketco_dashboard.html"#href="../"#' _site/fa/index.html
          else
            echo "::warning::reports/fa/index.html not found - the Persian page is not published"
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
