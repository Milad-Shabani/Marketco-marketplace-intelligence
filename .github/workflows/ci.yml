name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Regenerate synthetic dataset (smoke test)
        run: python scripts/generate_sample_data.py

      - name: Run full pipeline (forecast + churn + reports) (smoke test)
        run: python scripts/run_pipeline.py

      - name: Upload generated reports as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: novamart-reports-py${{ matrix.python-version }}
          path: |
            reports/MarketCo_Ops_CRM_Report.xlsx
            reports/marketco_dashboard.html
            reports/order_model_performance.csv
            reports/churn_model_performance.csv
